name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk remote-control-v0.1.1.apk
          sha256sum remote-control-v0.1.1.apk > remote-control-v0.1.1.apk.sha256

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.1 \
            remote-control-v0.1.1.apk \
            remote-control-v0.1.1.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "remote-control v0.1.1" \
            --prerelease \
            --notes $'Compatibility hotfix for UU Remote detection.\n\nFixes:\n- Follow the official Android deeplink discovery flow instead of resolving an already package-restricted Intent.\n- Verify the resolved handler belongs to the official com.netease.uuremote package before launching it.\n- Explicitly declare UU Remote package visibility for OEM Android compatibility.\n\nRequirements:\n- Android 8.0+ (API 26).\n- UU Remote 4.42.0 or newer.\n\nSigning note:\nThis pre-release still uses the Android debug signing key generated by the CI runner and is intended for compatibility testing.'
