name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk remote-control-v0.1.0.apk
          sha256sum remote-control-v0.1.0.apk > remote-control-v0.1.0.apk.sha256

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.0 \
            remote-control-v0.1.0.apk \
            remote-control-v0.1.0.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "remote-control v0.1.0" \
            --prerelease \
            --notes $'First installable Android companion build for OK-EF.\n\nFeatures:\n- Bind a Windows/macOS device through the official UU Remote deeplink flow.\n- Launch full-screen remote control in UU Remote.\n- Launch UU Remote picture-in-picture and handle the official callback result.\n- Validate bind nonce / PiP request IDs and clear stale device bindings.\n\nRequirements:\n- Android 8.0+ (API 26).\n- UU Remote 4.42.0 or newer.\n\nSigning note:\nThis initial pre-release uses the Android debug signing key generated by the CI runner. It is intended for testing; a future production-signed build may require uninstalling this version before installation.'
